[project]
name = "usm-ultra-virtual"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
test = ["pytest>=8", "httpx>=0.27"]
6502 = ["py65>=1.2.0,<2"]
[project.scripts]
usm = "usm.cli:main"
[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["usm*"]

[tool.setuptools.package-data]
usm = ["frontend/*.html"]
